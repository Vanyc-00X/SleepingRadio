org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Fail fast on unreachable dl.google.com so Aliyun/Central mirrors are used.
systemProp.org.gradle.internal.http.connectionTimeout=8000
systemProp.org.gradle.internal.http.socketTimeout=8000
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
# Do not attempt SDK component downloads from dl.google.com (times out here).
android.builder.sdkDownload=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Fix Kotlin incremental cache crash when project (D:) and pub-cache (C:) differ.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
kotlin.jvm.target.validation.mode=warning
# Avoid AGP class-copy collisions across drives / stale intermediates.
org.gradle.caching=false
org.gradle.parallel=false
org.gradle.configuration-cache=false
systemProp.org.gradle.internal.repository.max.tentatives=1
systemProp.org.gradle.internal.repository.max.backoff=1000
